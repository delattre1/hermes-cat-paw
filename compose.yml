name: hermes-cat-paw

services:
  hermes-cat-paw:
    # Hermes Cat Paw runs on the official Hermes base image.
    # Build: ~1min a frio (quase tudo é o pull upstream, público e anônimo).
    build: .
    environment:
      AGENT_ID: ${AGENT_ID:-hermes-cat-paw}
    volumes:
      # Criado por `plow-agents mint`; nunca commitar este arquivo.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # Home do agente (sessions, setup). `down -v` começa do zero.
      - hermes-cat-paw-home:/var/lib/hermes
    stop_grace_period: 35s

volumes:
  hermes-cat-paw-home:
